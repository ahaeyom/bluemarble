<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>온라인 부루마블</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <aside id="side">
      <h1>온라인 부루마블</h1>

      <section id="menu">
        <button id="go-local">한 화면에서 하기</button>
        <button id="go-online">온라인으로 하기</button>
      </section>

      <section id="local-setup" hidden>
        <p class="hint">2~5명 이름을 적어 주세요. 빈 칸은 빠져요.</p>
        <div id="local-names"></div>
        <button id="local-start">게임 시작</button>
        <p class="error" id="local-error"></p>
      </section>

      <section id="online" hidden>
        <section id="join-form">
          <label>이름 <input id="name" maxlength="12" placeholder="닉네임" /></label>
          <button id="create">방 만들기</button>
          <div class="row">
            <input id="code" maxlength="4" placeholder="방 코드" />
            <button id="join">참가</button>
          </div>
          <p id="error" class="error"></p>
        </section>
        <section id="room" hidden>
          <p>방 코드 <strong id="room-code"></strong></p>
          <button id="copy-link">초대 링크 복사</button>
          <ul id="players" class="plain"></ul>
          <button id="start-online">게임 시작</button>
          <p class="hint" id="room-hint"></p>
          <p class="error" id="room-error"></p>
        </section>
      </section>

      <section id="game-panel" hidden>
        <div class="turn-row"><div id="turn-info"></div><span id="timer"></span></div>
        <div id="actions"></div>
        <ul id="scoreboard" class="plain"></ul>
        <h2>기록</h2>
        <ol id="log"></ol>
      </section>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
